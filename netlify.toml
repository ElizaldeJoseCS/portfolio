[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No catch-all redirect. The build emits a real .html file per route (see the
# static-routes plugin in vite.config.ts), so pretty URLs resolve straight off
# the filesystem, and an unknown path falls through to the emitted 404.html
# with an actual 404 status — which a catch-all to index.html cannot do, since
# it answers 200 for pages that do not exist.

# Vite's own output. Every filename here carries a content hash, so it can be
# cached forever — a change ships under a new name.
[[headers]]
  for = "/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hand-authored files, whose names stay the same across deploys: resume.pdf,
# the papers, the OG card, project media. These must NOT be immutable —
# replacing a resume in place would otherwise be stuck in browser caches for a
# year. A day is long enough to be cheap and short enough to be fixable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
